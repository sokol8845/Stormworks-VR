<!doctype html>
<html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stormworks VR — zapis problemu</title>
<style>
body{font:16px system-ui,sans-serif;background:#111923;color:#e8f0f7;max-width:1060px;margin:32px auto;padding:0 20px}h1{font-size:26px}p{color:#b9c8d7}input{width:100%}pre{white-space:pre-wrap;background:#1a2938;padding:20px;border-radius:8px;line-height:1.6}canvas{width:100%;background:#172330;border-radius:8px}label{display:block;margin:18px 0 8px}details{margin-top:20px}button{background:#245a7e;color:white;border:1px solid #5e95bc;border-radius:5px;padding:8px 14px;cursor:pointer}
</style>
<h1>Zapis problemu VR</h1>
<p>Ostatnie zachowane pozycje dłoni i stan sterowania. Próbki co około 100 ms; ten podgląd nie odtwarza działania detektorów gestów.</p>
<button id="play">Odtwórz</button><label for="time" id="stamp"></label><input id="time" type="range" min="0" value="0" step="1">
<pre id="diagnostics"></pre><canvas id="hands" width="1000" height="360" aria-label="Pozycje dłoni: widok z przodu i z góry"></canvas>
<details><summary>Ustawienia w wybranej chwili</summary><pre id="config"></pre></details>
<script>
const data=__FLIGHT_DATA__,samples=data.samples,slider=document.getElementById('time'),canvas=document.getElementById('hands'),ctx=canvas.getContext('2d');
slider.max=samples.length-1;let timer;
function draw(){const s=samples[+slider.value];document.getElementById('stamp').textContent=`Czas ${(s.elapsed_ms/1000).toFixed(1)} s • klatka ${s.frame} • próbka ${+slider.value+1}/${samples.length}`;
document.getElementById('diagnostics').textContent=s.diagnostics.join('\n');document.getElementById('config').textContent=JSON.stringify(s.settings,null,2);
ctx.clearRect(0,0,1000,360);ctx.font='16px system-ui';ctx.fillStyle='#b9c8d7';ctx.fillText('Z przodu (X/Y)',18,28);ctx.fillText('Z góry (X/Z)',518,28);
for(let view=0;view<2;view++){const valid=[];for(const h of s.hands)if(h.active)for(const j of h.joints)if((j.flags&1)&&j.position.every(Number.isFinite))valid.push(j.position);
if(!valid.length){ctx.fillText('Brak śledzonych dłoni',view*500+18,90);continue;}
const axis=view?2:1,x=(Math.min(...valid.map(p=>p[0]))+Math.max(...valid.map(p=>p[0])))/2,y=(Math.min(...valid.map(p=>p[axis]))+Math.max(...valid.map(p=>p[axis])))/2;
const scale=Math.min(420/Math.max(.35,...valid.map(p=>2*Math.abs(p[0]-x))),260/Math.max(.35,...valid.map(p=>2*Math.abs(p[axis]-y))));
for(let hand=0;hand<2;hand++){const h=s.hands[hand];if(!h.active)continue;ctx.fillStyle=ctx.strokeStyle=hand?'#ffb35b':'#54d9ed';const point=j=>[view*500+250+(j.position[0]-x)*scale,195+(view?1:-1)*(j.position[axis]-y)*scale];
for(const j of h.joints){if(!(j.flags&1)||!j.position.every(Number.isFinite))continue;const p=point(j);ctx.beginPath();ctx.arc(p[0],p[1],3,0,Math.PI*2);ctx.fill();}
for(const chain of [[1,2,3,4,5],[1,6,7,8,9,10],[1,11,12,13,14,15],[1,16,17,18,19,20],[1,21,22,23,24,25]])for(let i=1;i<chain.length;i++){const a=h.joints[chain[i-1]],b=h.joints[chain[i]];if(!(a.flags&b.flags&1)||!a.position.every(Number.isFinite)||!b.position.every(Number.isFinite))continue;ctx.beginPath();ctx.moveTo(...point(a));ctx.lineTo(...point(b));ctx.stroke();}}
}ctx.fillStyle='#b9c8d7';ctx.fillText('Lewa: niebieska • prawa: pomarańczowa • skala dopasowana do próbki',18,344);}
const play=document.getElementById('play');
function pause(){if(timer)clearTimeout(timer);timer=null;play.textContent='Odtwórz';}
slider.addEventListener('input',()=>{pause();draw();});
function schedule(){const i=+slider.value;if(i>=samples.length-1){pause();return;}
 timer=setTimeout(()=>{slider.value=i+1;draw();schedule();},Math.min(1000,Math.max(10,samples[i+1].elapsed_ms-samples[i].elapsed_ms)));}
play.onclick=()=>{if(timer){pause();return;}if(+slider.value>=samples.length-1){slider.value=0;draw();}play.textContent='Pauza';schedule();};draw();
</script></html>
